<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTEL LA VISTA - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>HOTEL LA VISTA</h1>
            <p class="subtitle">Sign in to continue</p>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" value="admin">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" value="admin123">
            </div>
            
            <button id="loginBtn" class="login-btn">Sign In</button>
            
            <div class="demo-credentials">
                <p><strong>Demo Credentials:</strong></p>
                <p>Admin: admin / admin123</p>
                <p>Guest: user / user123</p>
            </div>
            
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
